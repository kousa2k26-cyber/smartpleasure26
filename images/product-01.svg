<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Body Ease Mini product image placeholder</title><desc id="desc">Abstract sage green product silhouette on a warm cream background. Replace with a real product photo.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f1ece2"/><stop offset="1" stop-color="#e1e9e0"/></linearGradient><linearGradient id="item" x2="1" y2="1"><stop stop-color="#96ae9b"/><stop offset="1" stop-color="#426452"/></linearGradient></defs>
  <rect width="600" height="600" fill="url(#bg)"/><circle cx="471" cy="127" r="85" fill="#fffaf2" opacity=".75"/><ellipse cx="302" cy="510" rx="123" ry="23" fill="#334f40" opacity=".1"/>
  <g transform="rotate(-18 300 300)"><rect x="239" y="145" width="122" height="302" rx="61" fill="url(#item)"/><ellipse cx="300" cy="192" rx="37" ry="27" fill="#c6d4c6" opacity=".8"/><rect x="277" y="265" width="46" height="95" rx="23" fill="#d9e2d8" opacity=".62"/><circle cx="300" cy="399" r="12" fill="#e6d4ca"/></g>
  <text x="300" y="564" text-anchor="middle" fill="#526a5c" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">PRODUCT PLACEHOLDER</text>
